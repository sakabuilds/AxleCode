name = "axle-download"
main = "src/index.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# RELEASE_LATEST_API_URL is authoritative: it resolves whatever GitHub marks as
# the latest release, so publishing a new tag needs no worker change. The pinned
# RELEASE_* block below is only the offline fallback used when the GitHub API is
# unreachable, so it has to mirror the same repository and a real published tag,
# with sizes and digests copied from that tag's released assets.
[vars]
RELEASE_LATEST_API_URL = "https://api.github.com/repos/thatcreativetayo/AxleCode/releases/latest"
RELEASE_PUBLIC_BASE_URL = "https://github.com/thatcreativetayo/AxleCode/releases/download/v1.1.24"
