name: Plugin Auth PR

on:
  pull_request:
    paths:
      - 'axle-auth-worker/**'
      - 'axle-desktop/source/apps/account-api/**'
      - 'axle-desktop/source/apps/desktop/**'
      - 'axle-desktop/source/apps/server/**'
      - 'axle-desktop/source/apps/web/**'
      - 'axle-desktop/source/packages/contracts/**'
      - 'axle-desktop/source/pnpm-lock.yaml'
      - '.github/workflows/plugin-auth-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axle-desktop/source
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: axle-desktop/source/pnpm-lock.yaml

      - name: Test Cloudflare plugin worker
        run: npm test
        working-directory: axle-auth-worker

      - name: Install desktop workspace dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck web
        run: pnpm --filter @axle/web typecheck

      - name: Typecheck server
        run: pnpm --filter t3 typecheck

      - name: Typecheck account API
        run: pnpm --filter @axle/account-api typecheck

      - name: Test account API Clerk configuration
        run: pnpm --filter @axle/account-api exec vp test run src/config.test.ts

      - name: Test web plugin and composer behavior
        run: pnpm --filter @axle/web exec vp test run --passWithNoTests --project unit src/components/plugins/pluginCatalog.test.ts src/composer-editor-mentions.test.ts src/composer-logic.test.ts src/AppRoot.test.tsx

      - name: Test server plugin session behavior
        run: pnpm --filter t3 exec vp test run src/plugins/workerSession.test.ts
